# Port 443: TLS termination + reverse proxy to the OpenMU admin panel (Blazor Server).
# This file is added to the active conf.d ONLY after the certificate exists, then nginx reloads.
# (Kept in a separate folder so nginx doesn't try to load it before the cert is issued.)

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.muss6.org;

    ssl_certificate     /etc/letsencrypt/live/admin.muss6.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.muss6.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Extra gate in front of the app's own login (defense in depth).
    auth_basic           "OpenMU Admin";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Needed for Blazor Server's SignalR WebSocket.
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 100s;

    resolver 127.0.0.11 ipv6=off;

    location / {
        proxy_pass http://openmu-startup:8080;
    }
}
