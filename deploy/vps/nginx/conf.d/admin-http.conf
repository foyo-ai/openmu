# Port 80: serves the Let's Encrypt ACME challenge, redirects everything else to HTTPS.
# Loaded first; the HTTPS server (admin-https.conf) is added after the cert is issued.

# Required so the Blazor Server SignalR WebSocket can be proxied (used by admin-https.conf).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.muss6.org;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
