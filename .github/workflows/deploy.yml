name: Deploy to Hetzner

# Builds the OpenMU image on GitHub's runners (NOT on the small VPS), pushes it to
# GHCR, then SSHes into the VPS to pull + restart only the app container.
on:
  push:
    branches:
      - production
  workflow_dispatch: {}   # allow manual "Run workflow" from the Actions tab

concurrency:
  group: deploy-hetzner
  cancel-in-progress: false   # never interrupt a deploy mid-flight

env:
  IMAGE: ghcr.io/${{ github.repository }}   # -> ghcr.io/foyo-ai/openmu

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push to GHCR
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          # The Startup Dockerfile COPYs paths relative to the src/ root,
          # so the build context MUST be src/, not the repo root.
          context: src
          file: src/Startup/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:production
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Pull & restart on the VPS over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/openmu/deploy/hetzner
            docker compose pull openmu-startup
            docker compose up -d openmu-startup
            docker image prune -f
